name: Download semanal - Dados Abertos ANTT

on:
  schedule:
    # Todo domingo às 23:00 UTC = 20:00 de domingo em Brasília (UTC-3)
    - cron: '0 23 * * 0'
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write      # necessário para o passo de commit/push

jobs:
  baixar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests pandas openpyxl

      - name: Executar o download
        run: python baixar_dados_antt.py

      - name: Commitar o arquivo atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração — arquivo idêntico ao da semana anterior."
          else
            git commit -m "Atualização automática dos dados ANTT - $(date +'%Y-%m-%d')"
            git push
          fi
